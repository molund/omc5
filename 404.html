<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Clayton Clipper Tracker</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <!-- GitHub Pages serves this, with a 404 status, for every missing address. It says so and links on rather than
         redirecting: Google treats a missing page that redirects to the home page as a soft 404 -->
    <script type="module" src="/about/main.js"></script>
  </head>
  <body>
    <main class="page-column [&_p]:mt-3.5 [&_p_a]:text-(--link)">
      <!-- the same slim bar as About's -->
      <header class="page-header">
        <a class="block leading-[0] logo" href="/"
          ><img class="h-10 w-auto logo" src="/images/logo.png" alt="Clayton Clipper" width="625" height="351"
        /></a>
        <h1 class="page-header-title">Page not found</h1>
        <nav class="page-header-nav">
          <a class="btn btn-grey" href="/">← Map</a>
        </nav>
      </header>

      <!-- SkyTrain car 404, in Trackside's photo style -->
      <figure class="mx-0 mt-2.5 mb-0">
        <img
          class="block h-auto w-full rounded-md"
          src="/images/404.webp"
          alt="SkyTrain car 404, a blue and grey SkyTrain, on the tracks"
          width="900"
          height="675"
        />
        <figcaption class="mt-1 text-sm text-(--mute) italic">
          SkyTrain car 404, also not found here. Photo by Dakota4791 on Reddit.
        </figcaption>
      </figure>

      <p>
        <b>There's nothing at this address.</b> It may have moved, or the link may have a typo. Try the
        <a href="/">map</a> or the latest updates on <a href="/trackside/">Trackside</a>.
      </p>
    </main>
  </body>
</html>
