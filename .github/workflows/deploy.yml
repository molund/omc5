name: Deploy to GitHub Pages

# Runs on every push to main. It can also be run by hand (Actions > Deploy to GitHub Pages > Run workflow) or through the API
# (a repository_dispatch "set-status" event, with any of span, complete and note in client_payload). Those runs update
# status.yaml: the time is set to now (Pacific, nearest quarter hour) and any values given override the file's. The change is
# committed to main, and the site is rebuilt and deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      span:
        description: "The span the Clayton Clipper gantry is working on (3-104); leave empty to keep status.yaml's"
        required: false
        type: string
      complete:
        description: "Is that span complete (or at least hung)? Leave empty to keep status.yaml's (a new span starts not complete)"
        required: false
        type: choice
        options: ["", "true", "false"]
      note:
        description: "Optional note for the progress card, added to status.yaml's notes (the card shows the newest); leave empty to add none, '-' to show none"
        required: false
        type: string
  repository_dispatch:
    types: [set-status, set-span]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update status.yaml
        if: github.event_name != 'push'
        env:
          SPAN: ${{ inputs.span || github.event.client_payload.span }}
          COMPLETE: ${{ inputs.complete || github.event.client_payload.complete }}
          NOTE: ${{ inputs.note || github.event.client_payload.note }}
        run: |
          msg=$(python3 .github/scripts/update_status.py)
          echo "$msg"
          # a second run in the same quarter hour with nothing new changes nothing
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "$msg"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # export the GeoJSON and KML from the drawing as it is now and publish them with the site, at
      # https://molund.github.io/omc5/data/ (the copies committed in data/ are only updated by running the export by hand)
      - run: npm run export-geojson
      - name: Publish the data files
        run: |
          mkdir -p dist/data/kml
          cp data/*.geojson data/control-points.json data/LICENSE data/README.md dist/data/
          cp data/kml/*.kml dist/data/kml/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
