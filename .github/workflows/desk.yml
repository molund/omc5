name: Land Leash Log changes

# The Leash Log (molund/omc5-admin) pushes its changes to the desk branch, with Mike's fine-grained token (Contents:
# read and write on this repo only): one commit per change, by "Mike Olund (Leash Log)", on top of main. This checks
# that the commits only change status.yaml and gantry-cycles.yaml and add photos (.github/scripts/check_desk.py), formats and
# builds the site, then moves main up to the branch (a fast-forward, so the commits land as they are). A push made with
# the built-in token doesn't start other workflows, so it then starts the deploy with a "desk-pushed"
# repository_dispatch, which deploy.yml runs without changing status.yaml.
on:
  push:
    branches: [desk]

permissions:
  contents: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits
        id: check
        run: python3 .github/scripts/check_desk.py
      # a mistake in the irregular shutdowns listed in gantry-cycles.yaml fails the run, so nothing is built or deployed, and GitHub
      # emails the failure. The check is the Leash Log's own (molund/omc5-admin's scripts/check-shutdowns.mjs, plain Node), so
      # there's one set of rules; warnings fail too
      - name: Check the irregular shutdowns
        run: |
          git clone --depth 1 https://github.com/molund/omc5-admin "$RUNNER_TEMP/omc5-admin"
          node "$RUNNER_TEMP/omc5-admin/scripts/check-shutdowns.mjs" gantry-cycles.yaml
      - uses: actions/setup-node@v4
        if: steps.check.outputs.count != '0'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.count != '0'
        run: npm ci
      - name: Check the formatting of status.yaml and gantry-cycles.yaml
        if: steps.check.outputs.count != '0'
        run: npx prettier --check status.yaml gantry-cycles.yaml
      - if: steps.check.outputs.count != '0'
        run: npm run build
      # refused if main has moved on since the desk pushed: the desk then pushes again on top of the new main
      - name: Move main up to the desk branch
        if: steps.check.outputs.count != '0'
        run: git push origin HEAD:refs/heads/main
      - name: Start the deploy
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/dispatches" -f event_type=desk-pushed
