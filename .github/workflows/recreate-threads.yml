name: Recreate the comment threads

# Run by hand (Actions > Recreate the comment threads > Run workflow): deletes every comment thread, comments and all, and makes
# them again from status.yaml with the DISCUSSION_TOKEN secret, so they are Mike's.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the build writes the thread titles and bodies (dist-ssr/threads.json)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Delete and recreate the comment threads
        env:
          GITHUB_TOKEN: ${{ secrets.DISCUSSION_TOKEN }}
        run: python3 .github/scripts/sync_discussions.py --recreate
