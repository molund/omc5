  - 2026-11-01: "The curious case of Clayton Clipper span 50"
    summary: "While tracing the guideway near Highway 15, I noticed one pillar appears to have been shifted west, making span 50 noticeably longer than the surrounding spans. There's also a concrete pad almost exactly where the pillar seems like it would have gone."
    post: true
    photo:
      file: 2026-11-01-span-50-pad.jpg
      caption: "I noticed this concrete pad while riding my bike through the area. It sits almost exactly where I would have expected a pillar if span 50 had been spaced more evenly."
    block:
      - "Most of the guideway follows a pretty regular pattern, so span 50 stood out right away. The concrete pad makes me wonder if they needed temporary support there during construction but couldn't place a permanent foundation in that location."
      - "My completely non-engineer theories range from a major buried utility, to some other underground constraint, to a previously undiscovered entrance to Fraggle Rock."
      - "Does anyone know why the pillar was shifted west and span 50 ended up so much longer than usual?"
