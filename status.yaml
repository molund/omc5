# Clayton Clipper status. The site reads it (src/lib/status.js); running the deploy workflow by hand or through the API updates
# it (see .github/workflows/deploy.yml). Times are Pacific, rounded to the nearest quarter hour.
updated: 2026-10-31T14:00-07:00
# the span the gantry is working on (Clayton Clipper span numbers, 3-104)
span: 36
# whether that span is complete (or at least hung)
complete: true
# every note, newest first, each stamped with the time of the update that added it; the progress card shows only the newest,
# under the date (an empty note shows none). A note can have a photo, indented under it, with its own caption:
#     photo:
#       file: span-36.jpg (in public/images/sorry-im-a-shitty-photographer/)
#       caption: "What the photo shows"
# more paragraphs and photos, indented under it (the card shows only the note, with a More link to the rest):
#     more:
#       - "A second paragraph"
#       - photo:
#           file: span-36-close-up.jpg
#           caption: "What the photo shows"
# and minor updates, indented under it (no photo, no comments thread or entry of their own; set `updated` to the newest):
#     minor:
#       - 2026-10-31T11:45-07:00: "What changed"
notes:
  - 2026-10-31T14:00-07:00: "Check-in from the bike: all the rocks are hung and span 36 is marked as complete. Now pedalling west of 176th St to see what the rest of the line is up to."
    more:
      - "The long-missing tulip where spans 70 and 71 meet, by the golf course, has finally been built. It was the last of the driven foundations. From 71/72 on, they switched to bored foundations."
      - photo:
          file: 2026-10-31-tulip-70-71.jpg
          caption: "The new tulip where spans 70 and 71 meet, wrapped in an orange tarp: propane heaters blow warm air inside so the concrete can cure in the cold weather. That's my Kona Unit X in front, photographed drive side out, of course."
      - "If you know the story behind this pillar, let me know in the comments."
  - 2026-10-31T09:30-07:00: "Only three segments have been hung for span 36. I'm guessing the night crew took Friday night off."
    photo:
      file: 2026-10-31-piper-and-toby.jpg
      caption: "My two trusty assistants on our way to look at cranes. Piper on the left is a four-year-old Bernedoodle. Toby on the right is an 11-year-old mini Australian Shepherd."
    minor:
      - 2026-10-31T11:45-07:00: "Six segments have been hung. There is a long line of semi trucks carrying the rest of the segments."
  - 2026-10-30T20:45-07:00: "The Clayton Clipper has moved to span 36."
  - 2026-10-30T12:45-07:00: "The Clayton Clipper has started moving its supports, getting ready to move from span 35 to span 36."
  - 2026-10-29T18:30-07:00: "Span 35's segments are glued, and Dywidag is post-tensioning now. The night shift should finish it. That makes the Clayton Clipper one-third done: 35 of 105 spans."
  - 2026-10-29T06:45-07:00: "All segments for span 35 are hung. A new precast beam arrived at the construction yard overnight. It will likely be installed in span 34, along with the beam that was already on site."
