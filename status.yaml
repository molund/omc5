# Clayton Clipper status. The site reads it (src/lib/status.js); running the deploy workflow by hand or through the API updates
# it (see .github/workflows/deploy.yml). Times are BC time (UTC−7), rounded to the nearest quarter hour.
updated: 2026-11-11T08:45-07:00
# the span the gantry is working on (Clayton Clipper span numbers, 3-104)
span: 40
# whether all that span's segments are hung. The map draws it hung; the progress card counts the span either way.
hung: true
# the Clayton Clipper's velocity in spans per week, a copy of gantry-cycles.yaml's (where its earlier values are), written by the
# Leash Log on every push
spans-per-week: 2.82
# Notes, newest first: a time stamp and a title, then a summary, and optionally `photo` (file in
# public/images/sorry-im-a-shitty-photographer/, caption), `block` (more paragraphs and photos) and `follow-up` (later
# time-stamped entries with their own summary, photo and block, and no title). See the notes below for the shapes.
# - The title leads a post and is the update's `?post=` slug on Trackside ("Clayton Clipper" becomes "Clipper"; a later
#   note with the same title gets -2). To keep the anchor when a title is edited, add `slug: words-here` under the note.
# - `post: true` makes a note a post instead of a status update: it never shows on the progress card, and its key can be a
#   date alone ("2026-11-01").
# - The progress card shows the newest note's summary, or its newest follow-up's, only when that time stamp is `updated`;
#   otherwise it has no text and a Trackside button. Set `updated` to the newest time stamp.
# - Summaries, paragraphs and captions can have links, [text](https://…), and bold, **text** or __text__ (src/lib/inline.js).
#   No other markdown: anything else shows as typed.
# Notes to self, and the steps of the gantry's cycle seen at each time stamp, are in gantry-cycles.yaml, not here.
