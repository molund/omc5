  - 2026-10-13T23:45-07:00: "How a Clayton Clipper sketch became a whole website"
    summary: "This is where it all started: a late-night project on Oct 13. I sketched the guideway past the South Fraser Maintenance and Storage Facility by hand from my walks with Piper and Toby, then brought it into Claude. It was a prediction: from the patterns in the beam connection points and the temporary wooden platforms, seen from the ground and in drone videos I found on YouTube, I could picture where a crane-lifted girder would go and what the gantry would build. No aerial photos, no website, just boxes, lines and a lot of squinting."
    photo:
      file: 2026-10-13-first-drawing.jpg
      caption: "The earliest version I still have, from soon after the hand drawing went into Claude on Oct 13, 2026: eleven gantry spans to go, a handful of precast girders done, and labels that only made sense to me."
    block:
      - "The plan was simple: post diagram updates to the SkyscraperPage forum every couple of weeks, showing actual progress and a refined prediction of what the Clayton Clipper would build. Then I started fixing it. The spans got traced against high-resolution aerial imagery, the supports got matched to within about a foot, and the drawing grew from one stretch by the SFMSF to the Clipper's whole route."
      - "The turning point was almost an accident. I asked Claude to make me a better viewer for the SVG, and it threw in checkboxes for every layer in the drawing without being asked. I started customizing them, then kept going, and eventually decided to see if I could get the whole thing onto GitHub. On Oct 28 it became a small website: a live map, a progress card counting the Clipper's spans, and a status file behind it all. A few days later it had comments, photos, this Trackside page and its own address."
      - "The coolest part is how I run it. From the Claude app, I can post updates, change features and fix code while I'm out on my bike or walking the dogs. Then, when I get back to my computer, Claude Code does the heavy lifting."
      - "Not bad for something that started as a few boxes on a screen. If you've been following along, thanks for reading, and let me know in the comments what you'd like to see next."
