<!-- Google tag (gtag.js) -->
<script>
  // the opt-out cookie (ga_optout=1, set by a bookmarklet in Safari on the phone) turns the tag off in that browser
  if (document.cookie.split("; ").includes("ga_optout=1")) window["ga-disable-G-M86QSPJJZN"] = true;
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M86QSPJJZN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());

  const cleanUrl = new URL(window.location.href);
  // these values differ per visit or per update; rewrite them so those page views roll up in the reports
  ["fbclid", "giscus", "post", "span"].forEach((p) => {
    if (cleanUrl.searchParams.has(p)) cleanUrl.searchParams.set(p, "any");
  });
  gtag("set", "page_location", cleanUrl.toString());

  // the view the map page opened on (?view=, "span" for a span link, or "progress" for a clean address), so the page view
  // says where visitors landed; picking another view afterwards is an event (src/lib/track.js), not a page view
  const opened = new URLSearchParams(window.location.search);
  const landingView = opened.has("span") ? "span" : (opened.get("view") ?? "progress");

  gtag("config", "G-M86QSPJJZN", window.location.pathname === "/" ? { landing_view: landingView } : {});
</script>
