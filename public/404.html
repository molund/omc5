<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Clayton Clipper Tracker</title>
    <!-- GitHub Pages serves this for every missing address: one under /trackside/ goes to Trackside, anything else to the map -->
    <script>
      location.replace(/^\/trackside(\/|$)/.test(location.pathname) ? "/trackside/" : "/");
    </script>
  </head>
  <body>
    <noscript
      ><p>Page not found. <a href="/">Go to the map</a> or <a href="/trackside/">Trackside</a>.</p></noscript
    >
  </body>
</html>
